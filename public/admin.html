<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | OPEN SKY ADVENTURES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: { brand: { dark: '#0B1D3A', navy: '#132C54' } }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

  <!-- Top Bar -->
  <header class="bg-brand-dark text-white border-b border-white/10 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center font-bold text-white text-sm">SB</div>
        <h1 class="font-bold text-lg tracking-tight">Admin Operations Control</h1>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <a href="/" class="text-teal-300 hover:underline">← Back to Website</a>
        <button onclick="loadAdminData()" class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition">Refresh Data</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
    
    <!-- Metrics Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">Total Bookings</span>
        <p id="metricTotal" class="text-3xl font-bold text-brand-dark mt-2">0</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">Confirmed USD Revenue</span>
        <p id="metricUSD" class="text-3xl font-bold text-teal-700 mt-2">$0</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">Confirmed KES Revenue</span>
        <p id="metricKES" class="text-3xl font-bold text-teal-700 mt-2">KES 0</p>
      </div>
    </div>

    <!-- Bookings Table Card -->
    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-6 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
        <h2 class="font-bold text-lg text-brand-dark">Customer Reservations</h2>
        <input id="adminSearch" type="text" placeholder="Search by name, reference, package..." oninput="filterTable()" class="w-full sm:w-80 px-4 py-2 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-teal-600" />
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
              <th class="p-4">Reference</th>
              <th class="p-4">Customer</th>
              <th class="p-4">Package & Destination</th>
              <th class="p-4">Travel Date</th>
              <th class="p-4">Guests</th>
              <th class="p-4">Total Amount</th>
              <th class="p-4">Payment</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody" class="divide-y divide-slate-100 text-sm">
            <tr><td colspan="9" class="p-8 text-center text-slate-400">Loading bookings from database...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let allBookings = [];

    async function loadAdminData() {
      try {
        const res = await fetch('/api/admin/bookings');
        const json = await res.json();
        if (json.success) {
          allBookings = json.data;
          document.getElementById('metricTotal').textContent = json.metrics.totalBookings;
          document.getElementById('metricUSD').textContent = `$${json.metrics.totalRevenueUSD.toLocaleString()}`;
          document.getElementById('metricKES').textContent = `KES ${json.metrics.totalRevenueKES.toLocaleString()}`;
          renderTable(allBookings);
        }
      } catch (err) {
        console.error('Failed to load admin dashboard:', err);
      }
    }

    function renderTable(bookings) {
      const tbody = document.getElementById('bookingsTableBody');
      if (!bookings.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-400">No bookings found in database.</td></tr>`;
        return;
      }

      tbody.innerHTML = bookings.map(b => `
        <tr class="hover:bg-slate-50/75 transition">
          <td class="p-4 font-mono font-bold text-brand-dark text-xs">${b.reference_code}</td>
          <td class="p-4">
            <p class="font-bold text-slate-800">${b.customer_name}</p>
            <p class="text-xs text-slate-500">${b.customer_email} • ${b.customer_phone}</p>
          </td>
          <td class="p-4">
            <p class="font-semibold text-teal-800">${b.package_title}</p>
            <p class="text-xs text-slate-500">${b.destination}</p>
          </td>
          <td class="p-4 whitespace-nowrap">${b.travel_date}</td>
          <td class="p-4 text-center">${b.guests}</td>
          <td class="p-4 font-bold whitespace-nowrap">${b.currency} ${Number(b.total_amount).toLocaleString()}</td>
          <td class="p-4 text-xs font-semibold text-slate-600">${b.payment_method}</td>
          <td class="p-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
              b.status === 'CONFIRMED' ? 'bg-emerald-100 text-emerald-800' :
              b.status === 'COMPLETED' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800'
            }">${b.status}</span>
          </td>
          <td class="p-4 text-center whitespace-nowrap">
            <select onchange="updateStatus(${b.id}, this.value)" class="text-xs p-1.5 rounded-lg border border-slate-300 bg-white">
              <option value="" disabled selected>Change Status</option>
              <option value="CONFIRMED">Confirm</option>
              <option value="COMPLETED">Complete</option>
              <option value="CANCELLED">Cancel</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const term = document.getElementById('adminSearch').value.toLowerCase();
      const filtered = allBookings.filter(b => 
        b.reference_code.toLowerCase().includes(term) ||
        b.customer_name.toLowerCase().includes(term) ||
        b.customer_email.toLowerCase().includes(term) ||
        b.package_title.toLowerCase().includes(term)
      );
      renderTable(filtered);
    }

    async function updateStatus(id, newStatus) {
      if (!confirm(`Are you sure you want to change booking #${id} status to ${newStatus}?`)) return;
      try {
        const res = await fetch(`/api/admin/bookings/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const json = await res.json();
        if (json.success) {
          loadAdminData();
        } else {
          alert(json.message || 'Failed to update status.');
        }
      } catch (err) {
        alert('Server network error.');
      }
    }

    loadAdminData();
  </script>
</body>
</html>
